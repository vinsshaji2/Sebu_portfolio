<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Sebastin Jojo</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="theme-color" content="#0A0A0B">
<style>
:root{
  --bg:#0A0A0B; --text:#F2F2F0; --text-muted:#9A9AA0; --accent:#E8C15A; --radius:2px;
  --font-display:"Iowan Old Style","Palatino Linotype","Palatino",P052,Georgia,"Times New Roman",serif;
  --font-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;min-height:100vh;min-height:100svh;background:var(--bg);color:var(--text);
  font-family:var(--font-body);font-size:17px;line-height:1.6;
  display:flex;align-items:center;justify-content:center;
  padding:clamp(24px,6vw,64px);text-align:center;-webkit-font-smoothing:antialiased;
}
.code{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 18px}
h1{font-family:var(--font-display);font-weight:400;line-height:1.05;
  font-size:clamp(2rem,8vw,3.5rem);margin:0 0 16px}
p.lead{color:var(--text-muted);margin:0 0 32px;max-width:46ch;margin-inline:auto}
a.btn{
  display:inline-flex;align-items:center;min-height:48px;padding:0 26px;
  background:var(--accent);color:#0A0A0B;border-radius:var(--radius);
  font-size:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;
  transition:background-color .25s cubic-bezier(.16,1,.3,1),color .25s cubic-bezier(.16,1,.3,1);
  border:1px solid var(--accent);
}
a.btn:hover{background:transparent;color:var(--accent)}
a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition-duration:.001ms !important}}
</style>
</head>
<body>
  <main>
    <p class="code">Error 404</p>
    <h1>Cut. That page doesn&rsquo;t exist.</h1>
    <p class="lead">The link may be broken or the page may have moved. Everything lives on one page anyway.</p>
    <a class="btn" href="/">Back to the portfolio</a>
  </main>
</body>
</html>
